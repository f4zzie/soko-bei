ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ ke.sokobei.ApplicationKt.module ]
  }
}

soko {
  cassandra {
    contact_points = "localhost:9042"
    contact_points = ${?CASSANDRA_CONTACT_POINTS}
    local_dc = "datacenter1"
    local_dc = ${?CASSANDRA_LOCAL_DC}
    keyspace = "soko_bei"
    keyspace = ${?CASSANDRA_KEYSPACE}
    replication = "datacenter1:1"
    replication = ${?CASSANDRA_REPLICATION}
    startup_timeout_seconds = 120
    startup_timeout_seconds = ${?CASSANDRA_STARTUP_TIMEOUT_SECONDS}
  }
  mongo {
    uri = "mongodb://localhost:27017"
    uri = ${?MONGODB_URI}
    database = "soko_bei"
    database = ${?MONGODB_DATABASE}
  }
  dev_mode = false
  dev_mode = ${?DEV_MODE}
  jwt_secret = "change-me-change-me-change-me-change-me"
  jwt_secret = ${?JWT_SECRET}
  otp_secret = "change-me-otp"
  otp_secret = ${?OTP_SECRET}
  admin_token = ""
  admin_token = ${?ADMIN_TOKEN}
  report_max_age_days = 14
  report_max_age_days = ${?REPORT_MAX_AGE_DAYS}
  min_price_per_kg = 1
  min_price_per_kg = ${?MIN_PRICE_PER_KG}
  max_price_per_kg = 100000
  max_price_per_kg = ${?MAX_PRICE_PER_KG}
  consent_version = 1
  consent_version = ${?CONSENT_VERSION}
  reports_per_hour = 30
  reports_per_hour = ${?REPORTS_PER_HOUR}
  otp_requests_per_15min = 3
  otp_requests_per_15min = ${?OTP_REQUESTS_PER_15MIN}
  jobs_enabled = true
  jobs_enabled = ${?JOBS_ENABLED}
  sms_provider = "console"
  sms_provider = ${?SMS_PROVIDER}
}
